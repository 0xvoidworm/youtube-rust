[package]
name = "youtube-rust"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
url = "=2.5.8"
whisper-rs = "=0.16.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
