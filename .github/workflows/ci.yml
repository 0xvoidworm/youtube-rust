name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake ffmpeg
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo doc --locked --workspace --all-features --no-deps
      - run: cargo build --locked --workspace --release
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
